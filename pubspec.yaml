name: diver_ley
description: "Diver_Ley: capacitación HSEQ tipo juego para llegar preparado a la auditoría."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/contenido/
    - assets/fonts/OFL-Rubik.txt
    - assets/fonts/OFL-NunitoSans.txt

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
